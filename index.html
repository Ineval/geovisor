<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geovisor INEVAL - SEST25</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="top-blue-bar"></div>
  <div id="top-yellow-bar"></div>

  <header id="main-header">
    <div class="official-brand">
      <img class="official-logo" src="logo.png" alt="Logo"/>
      <div class="brand-separator"></div>
      <div class="geoportal-title">GEOVISOR INSTITUTO NACIONAL DE EVALUACIÓN EDUCATIVA</div>
    </div>
  </header>

  <main id="app-layout">
    <aside id="sidebar">
      <div class="sidebar-content">
        <div id="status"></div>
        <div class="tool-box">
          <h2 class="tool-title">Mapa Base</h2>
          <select id="baseMapSelect">
            <option value="positron">CartoDB Claro</option>
            <option value="satellite">Esri Satélite</option>
            <option value="osm">OpenStreetMap</option>
            <option value="dark">CartoDB Oscuro</option>
          </select>
        </div>
        <div class="tool-box">
          <h2 class="tool-title">Filtros</h2>
          <label class="filter-label">Provincia</label><select id="provinceFilter"><option value="">-- Todo el Ecuador --</option></select>
          <label class="filter-label">Área</label><select id="areaFilter"><option value="">-- Todas --</option></select>
          <label class="filter-label">Régimen</label><select id="regimeFilter"><option value="">-- Todos --</option></select>
          <label class="filter-label">Sostenimiento</label><select id="sustainFilter"><option value="">-- Todos --</option></select>
        </div>
        <div class="tool-box">
          <h2 class="tool-title">Nivel · 2024-2025</h2>
          <div class="level-grid" id="level-container">
            <label class="level-item"><input type="radio" name="nivel-activo" class="level-check" value="elemental" checked>Elemental</label>
            <label class="level-item"><input type="radio" name="nivel-activo" class="level-check" value="medio">Medio</label>
            <label class="level-item"><input type="radio" name="nivel-activo" class="level-check" value="superior">Superior</label>
            <label class="level-item"><input type="radio" name="nivel-activo" class="level-check" value="bachillerato">Bachillerato</label>
          </div>
        </div>
        <div class="tool-box">
          <h2 class="tool-title">Asignaturas</h2>
          <div id="subject-grid-container" class="subject-grid"></div>
        </div>
      </div>
      <button id="toggle-btn">❮</button>
    </aside>

    <section id="map-container">
      <div id="map"></div>
    </section>
  </main>

  <div id="stats-box"><h2>📊 Estadísticas</h2><div id="stats-content"></div></div>
  <div id="footer-bar">© 2026 Instituto Nacional de Evaluación Educativa</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
