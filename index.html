<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Geovisor INEVAL - Histórico SEST</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" rel="stylesheet"/>
<link href="styles.css" rel="stylesheet"/>
</head>
<body>
<div id="top-blue-bar"></div>
<div id="top-yellow-bar"></div>
<header id="main-header">
<div class="official-brand">
<img alt="Logo El Nuevo Ecuador" class="official-logo" src="logo.png"/>
<div class="brand-separator"></div>
<div class="geoportal-title">GEOVISOR - EVALUACIÓN SER ESTUDIANTE</div>
</div>
</header>
<main id="app-layout">
<aside id="sidebar">
<div class="sidebar-content">
<div id="status"></div>
<div class="tool-box">
<h2 class="tool-title">
<svg viewbox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            Filtros Institucionales
          </h2>
<label class="filter-label">Provincia</label>
<select id="provinceFilter">
<option value="">-- Todo el Ecuador --</option>
<option value="01">01 - Azuay</option>
<option value="02">02 - Bolívar</option>
<option value="03">03 - Cañar</option>
<option value="04">04 - Carchi</option>
<option value="05">05 - Cotopaxi</option>
<option value="06">06 - Chimborazo</option>
<option value="07">07 - El Oro</option>
<option value="08">08 - Esmeraldas</option>
<option value="09">09 - Guayas</option>
<option value="10">10 - Imbabura</option>
<option value="11">11 - Loja</option>
<option value="12">12 - Los Ríos</option>
<option value="13">13 - Manabí</option>
<option value="14">14 - Morona Santiago</option>
<option value="15">15 - Napo</option>
<option value="16">16 - Pastaza</option>
<option value="17">17 - Pichincha</option>
<option value="18">18 - Tungurahua</option>
<option value="19">19 - Zamora Chinchipe</option>
<option value="20">20 - Galápagos</option>
<option value="21">21 - Sucumbíos</option>
<option value="22">22 - Orellana</option>
<option value="23">23 - Santo Domingo de los Tsáchilas</option>
<option value="24">24 - Santa Elena</option>
</select>
<label class="filter-label">Área</label><select id="areaFilter"><option value="">-- Todas --</option></select>
<label class="filter-label">Régimen</label><select id="regimeFilter"><option value="">-- Todos --</option></select>
<label class="filter-label">Sostenimiento</label><select id="sustainFilter"><option value="">-- Todos --</option></select>
</div>
<div class="tool-box">
<h2 class="tool-title">
<svg viewbox="0 0 24 24"><path d="M12 2L1 7l11 5 11-5-11-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
             Configuración de Capas
          </h2>
<label class="filter-label">Período Evaluado</label>
<select id="periodFilter">
<option selected="" value="25">2024 - 2025</option>
<option value="24">2023 - 2024</option>
<option value="23">2022 - 2023</option>
<option value="22">2021 - 2022</option>
</select>
<label class="filter-label" style="margin-top:10px;">Subnivel - Nivel</label>
<div class="level-grid">
<label class="level-item"><input checked="" class="level-check" name="nivel-activo" type="radio" value="elemental"/><svg height="14" style="flex:0 0 auto;" viewbox="0 0 14 14" width="14"><circle cx="7" cy="7" fill="#000" r="6"></circle></svg>Subnivel Básica Elemental</label>
<label class="level-item"><input class="level-check" name="nivel-activo" type="radio" value="medio"/><svg height="14" style="flex:0 0 auto;" viewbox="0 0 14 14" width="14"><polygon fill="#000" points="7,1 13,13 1,13"></polygon></svg>Subnivel Básica Media</label>
<label class="level-item"><input class="level-check" name="nivel-activo" type="radio" value="superior"/><svg height="14" style="flex:0 0 auto;" viewbox="0 0 14 14" width="14"><rect fill="#000" height="10" width="10" x="2" y="2"></rect></svg>Subnivel Básica Superior</label>
<label class="level-item"><input class="level-check" name="nivel-activo" type="radio" value="bachillerato"/><svg height="14" style="flex:0 0 auto;" viewbox="0 0 14 14" width="14"><polygon fill="#000" points="7,1 13,7 7,13 1,7"></polygon></svg>Nivel Bachillerato</label>
</div>
</div>
<div class="tool-box">
<h2 class="tool-title">
<svg viewbox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"></path></svg>
            Modelos Geoestadísticos
          </h2>
<div class="subject-grid" id="subject-grid-container">
<span style="font-size:12px; color:#94a3b8;">Selecciona al menos un nivel educativo primero.</span>
</div>
</div>
<div class="tool-box">
<h2 class="tool-title">
<svg viewbox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.61-1.27-7.4 5.74zM12 16l7.36-5.73L21 11.54l-9 7-9-7 1.63-1.27L12 16zm0-11.47L4.64 10.25 12 16l7.36-5.75L12 4.53z"></path></svg>
            Referencia
          </h2>
<label class="level-item"><input checked="" id="limitCheck" type="checkbox"/><svg height="14" style="flex:0 0 auto;" viewbox="0 0 14 14" width="14"><circle cx="7" cy="7" fill="#263746" r="6"></circle></svg>Límites Provinciales</label>
</div>
</div>
<button id="toggle-btn" title="Ocultar panel">❮</button>
</aside>
<section id="map-container">
<div id="map"></div>
<div class="map-base-floating">
<label>🗺️ Mapa Base</label>
<select id="baseMapSelect">
<option value="positron">CartoDB Claro (Positron)</option>
<option value="satellite">Esri Satélite (World Imagery)</option>
<option value="osm">OpenStreetMap (Clásico)</option>
<option value="dark">CartoDB Oscuro (Dark Matter)</option>
</select>
</div>
<div class="legend-floating-left" id="legendBox">
<button class="panel-min-btn" id="toggleLegendBtn" title="Minimizar simbología">−</button>
<strong>Niveles de logro</strong>
<div class="legend-actions">
<button id="selectAllLogrosBtn" type="button">Seleccionar todos</button>
<button id="clearLogrosBtn" type="button">Limpiar</button>
</div>
<label class="legend-item"><input checked="" class="logro-filter" type="checkbox" value="4"/><span class="legend-color" style="background:var(--color-dn4)"></span>800 - 1000 · Excelente</label>
<label class="legend-item"><input checked="" class="logro-filter" type="checkbox" value="3"/><span class="legend-color" style="background:var(--color-dn3)"></span>700 - 799 · Satisfactorio</label>
<label class="legend-item"><input checked="" class="logro-filter" type="checkbox" value="2"/><span class="legend-color" style="background:var(--color-dn2)"></span>600 - 699 · Elemental</label>
<label class="legend-item"><input checked="" class="logro-filter" type="checkbox" value="1"/><span class="legend-color" style="background:var(--color-dn1)"></span>400 - 599 · Insuficiente</label>
</div>
</section>
</main>
<div id="stats-box"><button class="panel-min-btn" id="toggleStatsBtn" title="Minimizar estadísticas">−</button><h2>📊 Estadísticas</h2><div id="stats-content"></div></div>
<div id="footer-bar">
<div class="footer-left"></div>
<div class="footer-center">© 2026 Instituto Nacional de Evaluación Educativa</div>
<div class="footer-right"><a href="pdf/01_INF_SEST25_EA_V3.pdf" target="_blank">📄 Descargar ficha</a></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
